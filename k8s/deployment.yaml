# 파일 위치: 프로젝트폴더/k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-server
  template:
    metadata:
      labels:
        app: spring-server
    spec:
      containers:
        - name: spring-server
          image: juwon0718/seminar-server:latest
          imagePullPolicy: Always # 항상 최신 이미지를 다시 받도록 설정
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-db:3306/seminar2025?useSSL=false&allowPublicKeyRetrieval=true"
            - name: MYSQL_USER
              value: "user"
            - name: MYSQL_PASSWORD
              value: "somepassword"
---
apiVersion: v1
kind: Service
metadata:
  name: spring-server-svc
spec:
  type: LoadBalancer # 외부에서 접속 가능하게 설정 (EC2 IP로 접속)
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: spring-server
