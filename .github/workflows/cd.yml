# TODO
name: Spring seminar CD
on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 올라오면 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 저장소에서 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 자바 17 설치 (Spring Boot 빌드용)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle로 빌드 (테스트는 생략하여 속도 향상)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인 (시크릿 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 후 푸시
      # 이미지 이름: juwon0718/seminar-server:latest
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: juwon0718/seminar-server:latest

      # 6. k8s 배포 파일(deployment.yaml)을 EC2로 복사 (SCP)
      - name: Copy k8s config to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/deployment.yaml"
          target: "/home/${{ secrets.EC2_USERNAME }}/"

      # 7. EC2에 접속해서 배포 명령어 실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 최신 설정 파일 적용 (Service, Deployment 등)
            # scp로 복사하면 /home/ubuntu/k8s/deployment.yaml 경로에 생깁니다.
            kubectl apply -f /home/${{ secrets.EC2_USERNAME }}/k8s/deployment.yaml
            
            # 2. 기존 파드를 재시작하여 방금 푸시한 최신 이미지(latest)를 다시 받아오게 함
            kubectl rollout restart deployment/spring-server
